services:
  backend:
    image: ${COMPOSE_PROJECT_NAME:-paperkit-pi}-backend:local
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0:8080
      DATABASE_PATH: /data/paperkit.sqlite3
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 2.0
    stop_grace_period: 40s
    volumes:
      - database:/data
      - backups:/backup
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    networks: [storage, egress]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    user: "10002:10002"
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    ports:
      - "127.0.0.1:${PROXY_PORT:-18080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    networks: [edge, storage]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/paperkit/healthz"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  database:
  backups:

networks:
  edge:
  egress:
  storage:
    internal: true
