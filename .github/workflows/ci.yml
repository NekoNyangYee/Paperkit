name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: paperkit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, versions and release tooling
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check versions
        run: node scripts/version.mjs
      - name: Release tooling tests
        run: |
          $env:PAPERKIT_TEST_POWERSHELL = (Get-Process -Id $PID).Path
          node --test scripts/version.test.mjs scripts/release.test.mjs
      - name: Format check
        run: pnpm format:check

  frontend-tests:
    name: Frontend / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Run frontend tests
        run: pnpm test:web:${{ matrix.suite }}

  rust-tests:
    name: Rust / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          install: "false"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ matrix.suite }}
      - uses: ./.github/actions/setup-native
      - name: Run Rust tests
        run: pnpm test:rust:${{ matrix.suite }}

  build:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-native
      - name: Validate production login configuration
        run: node scripts/check-auth-env.mjs
      - name: Build Windows installer
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis -- --locked
      - name: Installer checksum
        run: |
          $installers = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $installerHash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  $($installers[0].Name)" | Set-Content -LiteralPath target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Paperkit-Windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend / ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust and transaction/authentication tests
        run: |
          cargo fmt -p paperkit-api -- --check
          cargo clippy -p paperkit-api --all-targets --locked -- -D warnings
          cargo test -p paperkit-api --locked
          python3 -m unittest discover -s deploy -p 'test_*.py'
          for script in deploy/*.sh; do bash -n "$script"; done
      - name: Build native container and probe private API
        env:
          SUPABASE_URL: https://auth.example.invalid
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_not_a_real_project
        run: |
          bash deploy/init-env.sh
          sed -i 's|^DOCKER_PLATFORM=.*|DOCKER_PLATFORM=${{ matrix.platform }}|' .env
          docker compose --env-file .env config --quiet
          docker compose --env-file .env run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose --env-file .env up -d --build --wait --wait-timeout 120
          python3 deploy/smoke.py http://127.0.0.1:18080/paperkit
          bash deploy/backup.sh
          docker compose --env-file .env restart backend
          docker compose --env-file .env up -d --wait --wait-timeout 120
          python3 deploy/smoke.py http://127.0.0.1:18080/paperkit
      - name: Container logs
        if: failure()
        run: docker compose --env-file .env logs --tail=100
      - name: Stop CI containers without deleting volumes
        if: always()
        run: docker compose --env-file .env down
