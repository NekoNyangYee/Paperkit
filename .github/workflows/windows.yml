name: Windows CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, versions and release tooling
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check versions
        run: node scripts/version.mjs
      - name: Release tooling tests
        run: |
          $env:PAPERKIT_TEST_POWERSHELL = (Get-Process -Id $PID).Path
          node --test scripts/version.test.mjs scripts/release.test.mjs
      - name: Format check
        run: pnpm format:check

  frontend-tests:
    name: Frontend / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Run frontend tests
        run: pnpm test:web:${{ matrix.suite }}

  rust-tests:
    name: Rust / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          install: "false"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ matrix.suite }}
      - uses: ./.github/actions/setup-native
      - name: Run Rust tests
        run: pnpm test:rust:${{ matrix.suite }}

  build:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-native
      - name: Build Windows installer
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis -- --locked
      - name: Installer checksum
        run: |
          $installers = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $installerHash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  $($installers[0].Name)" | Set-Content -LiteralPath target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Paperkit-Windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [checks, frontend-tests, rust-tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NekoNyangYee/Paperkit'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Paperkit-Windows-x64
          path: release-assets
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: ./.github/scripts/publish-release.ps1 -Commit $env:RELEASE_SHA
