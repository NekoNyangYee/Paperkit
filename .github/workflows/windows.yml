name: Windows CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache
          key: native-windows-x64-${{ hashFiles('scripts/*manifest.json') }}
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check versions
        run: node scripts/version.mjs
      - name: Release tooling tests
        run: |
          $env:PAPERKIT_TEST_POWERSHELL = (Get-Process -Id $PID).Path
          node --test scripts/version.test.mjs scripts/release.test.mjs
      - name: Download and verify native resources
        run: |
          pnpm setup:pdfium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm setup:fonts
      - name: Format check
        run: pnpm format:check
      - name: Frontend tests
        run: pnpm test:web
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: PDFium integration
        run: pnpm test:pdfium
      - name: PDF edit, movement and alignment integration
        run: pnpm test:corpus
      - name: Watermark and signature integration
        run: pnpm test:stamps
      - name: Original font recovery integration
        run: cargo test -p pdf-core --locked recovers_embedded_cmap_and_edits_without_installed_original -- --ignored --nocapture
      - name: Font change and save integration
        run: cargo test -p pdf-core --locked --test fonts_smoke block_font_change_reflows_beyond_original_height_and_saves -- --ignored --nocapture
      - name: Build Windows installer
        working-directory: apps/desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --bundles nsis -- --locked
      - name: Installer checksum
        run: |
          $installers = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $installerHash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  $($installers[0].Name)" | Set-Content -LiteralPath target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Paperkit-Windows-x64
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NekoNyangYee/Paperkit'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Paperkit-Windows-x64
          path: release-assets
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: ./.github/scripts/publish-release.ps1 -Commit $env:RELEASE_SHA
