name: Deploy Raspberry Pi backend

on:
  workflow_run:
    workflows: [Backend API and ARM64 container]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paperkit-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'NekoNyangYee/Paperkit' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, paperkit-production]
    timeout-minutes: 45
    environment:
      name: production
      url: https://thkim.tail969319.ts.net/paperkit/healthz
    steps:
      - name: Deploy verified commit and check local and HTTPS APIs
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: sudo -n /usr/local/sbin/paperkit-deploy-verified "$DEPLOY_SHA"
