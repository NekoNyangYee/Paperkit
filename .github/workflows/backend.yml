name: Backend API and ARM64 container

on:
  pull_request:
    paths:
      - apps/backend/**
      - deploy/**
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .env.example
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/backend.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust and transaction/authentication tests
        run: |
          cargo fmt -p paperkit-api -- --check
          cargo clippy -p paperkit-api --all-targets --locked -- -D warnings
          cargo test -p paperkit-api --locked
          python3 -m unittest discover -s deploy -p 'test_*.py'
          for script in deploy/*.sh; do bash -n "$script"; done
      - name: Build native container and probe private API
        env:
          SUPABASE_URL: https://auth.example.invalid
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_not_a_real_project
        run: |
          bash deploy/init-env.sh
          sed -i 's|^DOCKER_PLATFORM=.*|DOCKER_PLATFORM=${{ matrix.platform }}|' .env
          docker compose --env-file .env config --quiet
          docker compose --env-file .env run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose --env-file .env up -d --build --wait --wait-timeout 120
          python3 deploy/smoke.py http://127.0.0.1:18080/paperkit
          bash deploy/backup.sh
          docker compose --env-file .env restart backend
          docker compose --env-file .env up -d --wait --wait-timeout 120
          python3 deploy/smoke.py http://127.0.0.1:18080/paperkit
      - name: Container logs
        if: failure()
        run: docker compose --env-file .env logs --tail=100
      - name: Stop CI containers without deleting volumes
        if: always()
        run: docker compose --env-file .env down
